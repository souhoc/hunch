name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MIN_COVERAGE: 70

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The generated completion scripts are syntax-checked against the real
      # shells; without these the relevant tests skip themselves.
      - name: Install shells
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "coverage ${total}% (minimum ${MIN_COVERAGE}%)" | tee -a "$GITHUB_STEP_SUMMARY"
          awk -v got="$total" -v min="$MIN_COVERAGE" \
            'BEGIN { if (got + 0 < min + 0) { print "below minimum"; exit 1 } }'
